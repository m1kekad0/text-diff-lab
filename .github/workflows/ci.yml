name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Lint sources
        run: npm run lint
      - name: Test line comparison, build and server
        run: npm test
      - name: Build static page
        run: npm run build
      - name: Install matching Chromium and Linux dependencies
        timeout-minutes: 5
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Check browser regression (normal)
        timeout-minutes: 3
        run: npm run check:browser
      - name: Check keyboard regression (normal)
        timeout-minutes: 3
        run: npm run check:keyboard
      - name: Check browser regression (Pages subpath)
        timeout-minutes: 3
        run: npm run check:browser
        env:
          PAGES_CHECK: '1'
      - name: Check keyboard regression (Pages subpath)
        timeout-minutes: 3
        run: npm run check:keyboard
        env:
          PAGES_CHECK: '1'
